[project]
name = "sateais"
version = "0.1.0"
description = "SateAIs Python SDK and CLI for SAR satellite image analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SpaceShift Inc.", email = "console-support@spcsft.com" }]
keywords = ["sentinel-1", "sar", "satellite", "geospatial", "remote-sensing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
sateais = "sateais.cli:main"

[project.urls]
Homepage = "https://console.spcsft.com"
Documentation = "https://docs.spcsft.com"
Repository = "https://github.com/spaceshiftinc/sateais-py"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sateais"]

[tool.hatch.build.targets.sdist]
include = [
    "src/sateais",
    "tests",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
